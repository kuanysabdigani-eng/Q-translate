<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосовой переводчик</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        select, button {
            margin: 10px 0;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            outline: none;
        }
        select {
            background: #334155;
            color: white;
            width: 100%;
        }
        button {
            background: #6366f1;
            color: white;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #4f46e5;
        }
        button.recording {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }
        .result-box {
            margin-top: 20px;
            text-align: left;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            min-height: 60px;
        }
        .label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Голосовой переводчик</h2>
        
        <label class="label" for="targetLang">Переводить на язык:</label>
        <select id="targetLang">
            <option value="en">Английский</option>
            <option value="kk">Казахский</option>
            <option value="ru">Русский</option>
            <option value="es">Испанский</option>
        </select>

        <button id="micBtn">Начать говорить</button>

        <div class="result-box">
            <div class="label">Вы сказали:</div>
            <div id="originalText">-</div>
        </div>

        <div class="result-box">
            <div class="label">Перевод:</div>
            <div id="translatedText">-</div>
        </div>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const originalTextDiv = document.getElementById('originalText');
        const translatedTextDiv = document.getElementById('translatedText');
        const targetLangSelect = document.getElementById('targetLang');

        // Проверка поддержки распознавания речи в браузере
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert('Ваш браузер не поддерживает распознавание речи. Попробуйте использовать Chrome или Safari.');
            micBtn.disabled = true;
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU'; // Язык, на котором вы будете говорить (можно сменить или сделать автоопределение)
            recognition.interimResults = false;

            let isRecording = false;

            micBtn.addEventListener('click', () => {
                if (!isRecording) {
                    recognition.start();
                } else {
                    recognition.stop();
                }
            });

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                micBtn.textContent = 'Слушаю... (нажмите, чтобы остановить)';
                originalTextDiv.textContent = 'Говорите...';
                translatedTextDiv.textContent = '-';
            };

            recognition.onresult = async (event) => {
                const speechToText = event.results[0][0].transcript;
                originalTextDiv.textContent = speechToText;

                // Перевод полученного текста через API
                await translateText(speechToText, targetLangSelect.value);
            };

            recognition.onerror = (event) => {
                console.error(event.error);
                originalTextDiv.textContent = 'Ошибка распознавания. Попробуйте еще раз.';
            };

            recognition.onend = () => {
                isRecording = false;
                micBtn.classList.remove('recording');
                micBtn.textContent = 'Начать говорить';
            };

            async function translateText(text, targetLang) {
                translatedTextDiv.textContent = 'Переводим...';
                try {
                    // Используем публичное API переводчика MyMemory
                    const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ru|${targetLang}`);
                    const data = await response.json();
                    
                    if (data && data.responseData) {
                        translatedTextDiv.textContent = data.responseData.translatedText;
                    } else {
                        translatedTextDiv.textContent = 'Ошибка перевода.';
                    }
                } catch (error) {
                    console.error(error);
                    translatedTextDiv.textContent = 'Не удалось связаться с сервером перевода.';
                }
            }
        }
    </script>
</body>
</html>
